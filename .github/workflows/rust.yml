name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    name: MSRV (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            toolchain: "1.85.0"
            command: cargo check -p einstellung --no-default-features
          - name: derive
            toolchain: "1.88.0"
            command: cargo check -p einstellung --no-default-features --features derive
          - name: yaml
            toolchain: "1.89.0"
            command: cargo check -p einstellung --no-default-features --features yaml
          - name: defaults
            toolchain: "1.89.0"
            command: cargo check -p einstellung
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
      - name: Check supported Rust floor
        run: ${{ matrix.command }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all-feature tests
        run: cargo nextest run --workspace --all-features --test-threads 1

      - name: Run doctests
        run: cargo test --workspace --all-features --doc

      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Check individual features
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p einstellung --no-default-features
          for feature in derive json toml yaml key-value env dotenv; do
            cargo check -p einstellung --no-default-features --features "$feature"
            cargo test -p einstellung --lib --no-default-features --features "$feature"
          done

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
