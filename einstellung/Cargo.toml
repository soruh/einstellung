[package]
name = "einstellung"
version = "0.1.6"
edition = "2024"
description = "A Rust Configuration Parser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soruh/einstellung"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

serde_json = { version = "1.0", optional = true }
dotenvy = { version = "0.15.7", optional = true }
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0", optional = true }
toml = { version = "0.9.8", optional = true }

einstellung_derive = { version = "0.1.6", path = "../einstellung_derive", optional = true }

[[example]]
name = "simple"
required-features = ["derive", "json", "toml", "yaml"]

[[example]]
name = "layered"
required-features = ["derive", "json", "toml", "yaml"]

[dev-dependencies]
anyhow = "1.0"
insta = "1.46.3"


[features]
derive = ["dep:einstellung_derive"]

dotenv = ["env", "dep:dotenvy"]
env = ["dep:serde_json"]
json = ["dep:serde_json"]
toml = ["dep:toml"]
yaml = ["dep:serde_yaml"]

full = ["dotenv", "env", "json", "toml", "yaml", "derive"]

default = ["json", "toml", "yaml", "derive"]
